<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f12">
<title>Iron Log</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏋️</text></svg>">
<style>
  :root{
    --bg:#0d0f12; --panel:#161a20; --panel-2:#1e242c; --line:#2a323d;
    --ink:#eef2f7; --muted:#8b97a8; --accent:#ff6b35; --accent-ink:#1a0d06;
    --good:#3ddc97; --warn:#ffc857;
    --tap:64px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    padding:0 0 140px; overscroll-behavior-y:contain;
  }
  header{
    position:sticky; top:0; z-index:20; background:rgba(13,15,18,.94);
    backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
    padding:14px 16px 12px;
  }
  .hrow{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
  h1{font-size:19px; margin:0; letter-spacing:-.01em}
  .day{color:var(--accent); font-weight:700}
  .meta{color:var(--muted); font-size:13px; margin-top:3px; display:flex; gap:12px; flex-wrap:wrap}
  .pill{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600;
    padding:3px 9px; border-radius:999px; border:1px solid var(--line); color:var(--muted)}
  .pill.ok{color:var(--good); border-color:#20493c}
  .pill.pending{color:var(--warn); border-color:#4a3d1a}
  main{padding:16px; max-width:640px; margin:0 auto}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:16px; margin-bottom:14px}
  .card.done{border-color:#20493c}
  .prow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
  .prow .wide{flex:1 1 100%;text-align:left}
  .plabel{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
    padding-right:2px;flex:none}
  .pmark{opacity:.7;font-weight:400}
  .card.outstanding{border-left:3px solid var(--warn);background:var(--panel-2);
    font-size:14px;line-height:1.5}
  .exhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .formlink{
    flex:none;font-size:13px;font-weight:600;color:var(--accent);text-decoration:none;
    border:1px solid var(--line);border-radius:8px;padding:6px 10px;white-space:nowrap;
    min-height:32px;display:inline-flex;align-items:center;
  }
  .formlink:hover,.formlink:focus-visible{border-color:var(--accent);background:var(--panel-2)}
  .formlink:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .exname{font-size:18px; font-weight:700; margin:0 0 2px; letter-spacing:-.01em}
  .target{color:var(--muted); font-size:13px; margin-bottom:2px}
  .last{color:var(--muted); font-size:13px; margin-bottom:14px}
  .last b{color:var(--ink); font-weight:600}
  .chips{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; min-height:4px}
  /* A chip is a button: tapping a logged set opens it for correction. Sized to
     the same tap target as everything else — this gets used mid-set with one
     hand and chalk on it. */
  .chip{background:var(--panel-2); border:1px solid var(--line); border-radius:10px;
    font:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent;
    padding:7px 11px; font-variant-numeric:tabular-nums; font-size:14px; font-weight:600}
  .chip.fresh{border-color:var(--accent); color:var(--accent)}
  .chip:active{transform:scale(.95)}
  .chip.editing{border-color:var(--accent); box-shadow:0 0 0 2px rgba(255,255,255,.06)}
  dialog .acts button.danger{background:transparent; color:var(--bad,#e5484d);
    border-color:var(--bad,#e5484d)}
  .steppers{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px}
  .stepper{background:var(--panel-2); border:1px solid var(--line); border-radius:12px; padding:8px}
  .stepper .lab{font-size:11px; text-transform:uppercase; letter-spacing:.08em;
    color:var(--muted); text-align:center; margin-bottom:4px; font-weight:700}
  .srow{display:flex; align-items:center; justify-content:space-between; gap:4px}
  .sbtn{width:44px; height:44px; flex:none; border-radius:10px; border:1px solid var(--line);
    background:#0f1318; color:var(--ink); font-size:22px; font-weight:700; cursor:pointer}
  .sbtn:active{background:var(--accent); color:var(--accent-ink)}
  .sval{flex:1; text-align:center; font-size:26px; font-weight:800; font-variant-numeric:tabular-nums;
    background:none; border:0; color:var(--ink); width:100%; padding:0; min-width:0}
  .sval:focus{outline:2px solid var(--accent); border-radius:8px}
  .logbtn{width:100%; min-height:var(--tap); border-radius:14px; border:0; cursor:pointer;
    background:var(--accent); color:var(--accent-ink); font-size:17px; font-weight:800; letter-spacing:.01em}
  .logbtn:active{transform:scale(.985)}
  .logbtn[disabled]{background:var(--panel-2); color:var(--muted)}
  .rest{position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--panel);
    border-top:1px solid var(--line); padding:14px 16px calc(14px + env(safe-area-inset-bottom));
    display:none; align-items:center; gap:14px}
  .rest.on{display:flex}
  .rest .t{font-size:34px; font-weight:800; font-variant-numeric:tabular-nums; min-width:92px}
  .rest .t.zero{color:var(--good)}
  .rest .lab{color:var(--muted); font-size:13px; flex:1}
  .rest button{min-height:46px; padding:0 16px; border-radius:12px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--ink); font-weight:700; cursor:pointer; font-size:15px}
  .foot{display:flex; gap:10px; margin-top:20px}
  .foot button{flex:1; min-height:54px; border-radius:14px; border:1px solid var(--line);
    background:var(--panel); color:var(--ink); font-weight:700; font-size:15px; cursor:pointer}
  .foot button.primary{background:var(--good); color:#062018; border-color:transparent}
  .rest-day{text-align:center; padding:34px 20px; color:var(--muted)}
  .rest-day h2{color:var(--ink); font-size:22px; margin:0 0 8px}
  .picker{display:flex; gap:6px; overflow-x:auto; padding:12px 16px 0; max-width:640px; margin:0 auto}
  .picker button{flex:none; min-height:38px; padding:0 13px; border-radius:10px; font-size:13px;
    font-weight:700; border:1px solid var(--line); background:var(--panel); color:var(--muted); cursor:pointer}
  .picker button.sel{background:var(--accent); color:var(--accent-ink); border-color:transparent}
  dialog{border:1px solid var(--line); background:var(--panel); color:var(--ink);
    border-radius:16px; padding:20px; max-width:400px; width:calc(100% - 32px)}
  dialog::backdrop{background:rgba(0,0,0,.6)}
  dialog h3{margin:0 0 14px; font-size:18px}
  dialog label{display:block; font-size:12px; text-transform:uppercase; letter-spacing:.07em;
    color:var(--muted); font-weight:700; margin:12px 0 5px}
  dialog input,dialog select,dialog textarea{width:100%; background:var(--panel-2); color:var(--ink);
    border:1px solid var(--line); border-radius:10px; padding:11px; font-size:16px; font-family:inherit}
  dialog .acts{display:flex; gap:10px; margin-top:18px}
  dialog .acts button{flex:1; min-height:48px; border-radius:12px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--ink); font-weight:700; font-size:15px; cursor:pointer}
  dialog .acts button.primary{background:var(--good); color:#062018; border-color:transparent}
  .hist{font-size:14px}
  .hist .h{padding:12px 0; border-bottom:1px solid var(--line)}
  .hist .h:last-child{border-bottom:0}
  .hist .hd{font-weight:700; margin-bottom:3px}
  .hist .hl{color:var(--muted); font-variant-numeric:tabular-nums}
  .empty{color:var(--muted); text-align:center; padding:26px 0}

  /* ---------- tabs ---------- */
  .tabs{display:flex; gap:6px; margin-top:10px}
  .tabs button{flex:1; min-height:38px; border-radius:10px; border:1px solid var(--line);
    background:var(--panel); color:var(--muted); font-weight:700; font-size:14px; cursor:pointer}
  .tabs button.sel{background:var(--panel-2); color:var(--ink); border-color:var(--accent)}
  [hidden]{display:none !important}

  /* ---------- planner ---------- */
  .pday h2{font-size:16px; margin:0 0 10px; letter-spacing:-.01em}
  .slots{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  @media (max-width:420px){ .slots{grid-template-columns:1fr} }
  .slot{text-align:left; background:var(--panel-2); border:1px solid var(--line); border-radius:12px;
    padding:10px 12px; color:var(--ink); font:inherit; cursor:pointer; min-height:72px}
  .slot:hover,.slot:focus-visible{border-color:var(--accent)}
  .slot.locked{border-color:#20493c}
  .slot .st{display:flex; justify-content:space-between; gap:8px; font-size:11px; font-weight:700;
    text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:4px}
  .slot .st .lk{color:var(--good)}
  .slot .st .dr{color:var(--warn)}
  .slot ul{margin:0; padding:0; list-style:none; font-size:13px; line-height:1.4}
  .slot li{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .slot .none{color:var(--muted); font-size:13px}
  .slot{min-width:0}
  .slot.prog li{white-space:normal}
  .tag{display:inline-block; font-size:11px; font-weight:700; padding:1px 7px; border-radius:999px;
    border:1px solid var(--line); color:var(--muted); margin-left:6px; vertical-align:1px}
  .lib .li{display:flex; justify-content:space-between; align-items:center; gap:10px; width:100%;
    padding:10px 0; border:0; border-bottom:1px solid var(--line); background:none; color:var(--ink);
    font:inherit; text-align:left; cursor:pointer}
  .lib .li:last-child{border-bottom:0}
  .lib .li small{color:var(--muted); font-size:13px; white-space:nowrap}
  .cardhead{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:8px}
  .cardhead h2{font-size:16px; margin:0}
  .smallbtn{min-height:36px; padding:0 12px; border-radius:10px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--ink); font-weight:700; font-size:13px; cursor:pointer}
  .note{font-size:13px; color:var(--muted); margin:0 0 12px}
  .note.warnish{border-left:3px solid var(--warn); padding-left:10px}

  #slotDlg{max-width:560px}
  .srows{display:flex; flex-direction:column; gap:10px}
  .srow2{background:var(--panel-2); border:1px solid var(--line); border-radius:12px; padding:10px}
  .srow2 .nm{display:flex; justify-content:space-between; align-items:center; gap:8px; font-weight:700; margin-bottom:8px}
  .srow2 .nm .mv{display:flex; gap:4px}
  .srow2 .nm .mv button{width:34px; height:34px; border-radius:8px; border:1px solid var(--line);
    background:#0f1318; color:var(--ink); cursor:pointer; font-size:15px}
  .srow2 .f3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px}
  .srow2 .f3 label{margin:0 0 3px; font-size:10px}
  .srow2 .f3 input{padding:8px; font-size:15px}
  .addrow{display:flex; gap:8px; margin-top:12px}
  .addrow select{flex:1}
  .addrow button{flex:none; min-height:44px; padding:0 14px; border-radius:10px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--ink); font-weight:700; cursor:pointer}
  .ro li{padding:4px 0}
  .lockinfo{font-size:13px; color:var(--good); margin:-4px 0 12px}
  .rm table{width:100%; border-collapse:collapse; font-size:14px; font-variant-numeric:tabular-nums}
  .rm th{font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); text-align:left;
    padding:6px 4px; border-bottom:1px solid var(--line)}
  .rm td{padding:8px 4px; border-bottom:1px solid var(--line); vertical-align:top}
  .rm td .hist{color:var(--muted); font-size:12px; margin-top:2px}
  .chk{display:flex !important; align-items:center; gap:8px; text-transform:none !important;
    letter-spacing:0 !important; font-size:14px !important; color:var(--ink) !important}
  .chk input{width:auto}

  /* ---------- planner filters ---------- */
  .fchips{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:0 0 8px}
  .fchip{min-height:32px; padding:0 11px; border-radius:999px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--muted); font-weight:700; font-size:13px; cursor:pointer}
  .fchip.sel{background:var(--accent); color:var(--accent-ink); border-color:transparent}
  .lib .li span .tag:first-of-type{margin-left:8px}

  /* ---------- away days ---------- */
  .cal{display:grid; grid-template-columns:repeat(7,1fr); gap:4px}
  .calh{font-size:11px; font-weight:700; color:var(--muted); text-align:center; padding-bottom:2px}
  .calc{min-height:48px; border-radius:8px; border:1px solid var(--line); background:var(--panel-2);
    padding:4px 5px; font-size:12px; font-variant-numeric:tabular-nums; display:flex; flex-direction:column; gap:2px}
  .calc.past{opacity:.4}
  .calc.today{border-color:var(--accent)}
  .calc.away{background:repeating-linear-gradient(135deg,#3a1f24 0 6px,#2a171b 6px 12px); border-color:#7a3340}
  .calc.away b{color:#ff8a9a; font-size:11px}
  /* ---------- blocks, pool, tally ---------- */
  .blk.ss{border-left:3px solid var(--line); padding-left:10px; margin-bottom:6px}
  .blockhead{font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    color:var(--muted); margin:4px 0 8px}
  .card.next{border-color:var(--accent)}
  .nexttag{font-size:11px; font-weight:800; color:var(--accent-ink); background:var(--accent);
    border-radius:999px; padding:1px 8px; vertical-align:3px; letter-spacing:.04em}
  .cues{margin:6px 0 4px; padding-left:18px; font-size:13px; color:var(--warn)}
  .cues li{margin:2px 0}
  details.warm{margin-bottom:14px}
  details.warm summary{cursor:pointer; color:var(--muted); font-size:14px; font-weight:700;
    padding:10px 0; min-height:44px}
  .poolcard{border-left:3px solid var(--warn)}
  .plist{margin:0; padding:0; list-style:none; font-size:14px}
  .plist li{padding:3px 0}
  .tally .trow{display:grid; grid-template-columns:90px 1fr 82px; gap:10px; align-items:center;
    font-size:14px; padding:4px 0}
  .tally .tbar{height:8px; border-radius:999px; background:var(--panel-2); overflow:hidden}
  .tally .tbar i{display:block; height:100%; background:var(--muted)}
  .tally .s-on .tbar i{background:var(--good)}
  .tally .s-over .tbar i{background:var(--accent)}
  .tally .s-under .tbar i{background:var(--warn)}
  .tally .tv{text-align:right; font-variant-numeric:tabular-nums; color:var(--muted)}
  .tally .tv b{color:var(--ink)}
  .awaytag{font-size:12px; font-weight:700; color:#ff8a9a; margin-left:10px; vertical-align:2px}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <h1>Iron Log</h1>
    <span class="day" id="dayLabel">—</span>
  </div>
  <div class="meta">
    <span id="clock">—</span>
    <span id="elapsed"></span>
    <span class="pill" id="sync">checking…</span>
  </div>
  <nav class="tabs" id="tabs">
    <button data-tab="log" class="sel">Log</button>
    <button data-tab="planner">Planner</button>
  </nav>
</header>

<div id="logView">
  <div class="picker" id="picker"></div>
  <main id="app"></main>
</div>

<main id="plannerView" hidden></main>

<dialog id="slotDlg">
  <h3 id="slotTitle">—</h3>
  <div id="slotBody"></div>
  <div class="acts" id="slotActs"></div>
</dialog>

<dialog id="exDlg">
  <h3>New exercise</h3>
  <label for="exName">Name</label>
  <input id="exName" type="text" maxlength="80" placeholder="e.g. Cable Row">
  <div class="steppers" style="margin:0">
    <div><label for="exMuscle">Muscle group</label><select id="exMuscle"></select></div>
    <div><label for="exEquip">Type</label><select id="exEquip"></select></div>
  </div>
  <div class="steppers" style="margin:0">
    <div><label for="exSets">Sets</label><input id="exSets" type="number" inputmode="numeric" min="1" max="12" value="3"></div>
    <div><label for="exReps">Reps</label><input id="exReps" type="text" value="8-12" placeholder="8-12"></div>
    <div><label for="exWeight" id="exWLab">Suggested kg</label><input id="exWeight" type="number" inputmode="decimal" step="0.5" min="0" placeholder="optional"></div>
    <div><label for="exRest">Rest (s)</label><input id="exRest" type="number" inputmode="numeric" min="0" value="75"></div>
  </div>
  <label class="chk"><input id="exSide" type="checkbox"> Logged per arm / side</label>
  <p id="exErr" class="note warnish" hidden></p>
  <div class="acts">
    <button id="exCancel">Cancel</button>
    <button id="exSave" class="primary">Add to library</button>
  </div>
</dialog>

<dialog id="rmDlg">
  <h3 id="rmTitle">Rep maxes</h3>
  <div class="rm" id="rmBody"><div class="empty">Loading…</div></div>
  <div class="acts"><button id="rmClose" class="primary">Close</button></div>
</dialog>

<div class="rest" id="rest">
  <div class="t" id="restT">0:00</div>
  <div class="lab" id="restL">Rest</div>
  <button id="restSkip">Skip</button>
  <button id="restAdd">+30s</button>
</div>

<dialog id="endDlg">
  <h3>Finish session</h3>
  <label for="bw">Bodyweight (kg) — optional</label>
  <input id="bw" type="number" step="0.01" inputmode="decimal" placeholder="86.26">
  <label for="felt">How did it feel?</label>
  <select id="felt">
    <option value="Easy - add load next time">Easy — add load next time</option>
    <option value="On track" selected>On track</option>
    <option value="Hard - hold">Hard — hold here</option>
    <option value="Needs deload">Needs deload</option>
  </select>
  <label for="notes">Notes — optional</label>
  <textarea id="notes" rows="2" placeholder="Anything worth telling Claude"></textarea>
  <div class="acts">
    <button id="endCancel">Cancel</button>
    <button id="endGo" class="primary">Finish &amp; sync</button>
  </div>
</dialog>

<dialog id="editDlg">
  <h3>Edit set</h3>
  <p id="edWhat" style="margin:-6px 0 14px; color:var(--muted); font-size:13px"></p>
  <div class="steppers">
    <div class="stepper">
      <div class="lab">Reps</div>
      <div class="row">
        <button type="button" data-ed="reps|-1">&minus;</button>
        <input id="edReps" type="number" inputmode="numeric" step="1">
        <button type="button" data-ed="reps|1">+</button>
      </div>
    </div>
    <div class="stepper">
      <div class="lab" id="edWLab">Weight kg</div>
      <div class="row">
        <button type="button" data-ed="weight|-1">&minus;</button>
        <input id="edWeight" type="number" inputmode="decimal" step="0.5">
        <button type="button" data-ed="weight|1">+</button>
      </div>
    </div>
  </div>
  <div class="acts">
    <button id="edCancel">Cancel</button>
    <button id="edDelete" class="danger">Delete</button>
    <button id="edSave" class="primary">Save</button>
  </div>
</dialog>

<dialog id="histDlg">
  <h3>Recent sessions</h3>
  <div class="hist" id="histBody"><div class="empty">Loading…</div></div>
  <div class="acts">
    <button id="histExport">Export JSON</button>
    <button id="histClose" class="primary">Close</button>
  </div>
</dialog>

<script src="programme.js"></script>
<script src="week.js"></script>
<script>
(function(){
  "use strict";

  var OUTBOX = "ironlog.outbox.v1";
  var DELBOX = "ironlog.delbox.v1";   // deletions awaiting sync, kept apart from
                                      // OUTBOX so the existing queue format is untouched
                                      // and anything already sitting in it still flushes
  var LOCAL   = "ironlog.local.v1";
  var STARTED = "ironlog.started.v1";
  var PLAN    = "ironlog.plan.v1";    // last copy of the planner, so the gym
  var LIB     = "ironlog.lib.v1";     // still gets Sophie's sessions offline
  var WEEK    = "ironlog.week.v1";    // last /api/week-status, so the pool and the
                                      // tally still show at the rack with no signal

  var state = {
    day: null,          // weekday key of the CORE session in view
    mode: "core",       // "core" | "pool" | "pt" | "bonus" — none of the others replaces core
    bonusId: null,      // which bonus, when mode === "bonus"
    chosen: false,      // the session in view was picked (or resumed), not defaulted
    week: null,         // /api/week-status: the week's sets, for the pool and the tally
    date: todayISO(),
    sets: [],           // sets logged today (local truth)
    last: {},           // exercise -> previous session summary
    plan: read(PLAN, []),   // fourteen slots from /api/plan
    lib: read(LIB, []),     // the exercise library from /api/exercises
    restTimer: null,
    restLeft: 0
  };

  // ---------- storage helpers ----------
  function read(k, fb){ try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; }catch(e){ return fb; } }
  function write(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  function todayISO(){
    var d = new Date(), p = function(n){ return String(n).padStart(2,"0"); };
    return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
  }
  function uid(){
    if (self.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "s-"+Date.now()+"-"+Math.random().toString(16).slice(2,10);
  }

  // ---------- sync ----------
  function outbox(){ return read(OUTBOX, []); }
  function queue(rec){
    /* Replace rather than append when the id is already waiting: editing a set
       that has not synced yet should send ONE corrected row, not the original
       followed by a correction. */
    var q = outbox(), found = false;
    for (var i = 0; i < q.length; i++){
      if (q[i].id === rec.id){ q[i] = rec; found = true; break; }
    }
    if (!found) q.push(rec);
    write(OUTBOX, q);
    paintSync(); flush();
  }
  function delbox(){ return read(DELBOX, []); }
  function queueDelete(id){
    /* Drop any pending write for this set AND queue the delete. Dropping alone
       is not enough: a flush may already be in flight with that row in it, and
       then nothing would ever remove it. Deleting a row that was never inserted
       is a harmless no-op, so the redundant case costs nothing. */
    write(OUTBOX, outbox().filter(function(s){ return s.id !== id; }));
    var d = delbox();
    if (d.indexOf(id) < 0) d.push(id);
    write(DELBOX, d);
    paintSync(); flush();
  }
  var flushing = false, lastSyncFailed = false;
  function flush(){
    var q = outbox(), dq = delbox();
    /* 🔴 FIXED 10 Sep 2026 — navigator.onLine USED TO GATE THIS, and it lies.
       It reports whether the browser has an interface, not whether it can reach
       anything, and it false-negatives on VPNs, captive portals and tabs resumed
       from background. When it was wrong the app refused to even ATTEMPT a sync,
       sat there saying "offline", and retried nothing — which is exactly what
       Karl hit mid-session: "It says no network, but there clearly is."
       Now the only reasons not to try are: nothing queued, or already trying.
       A failed attempt costs one request and leaves the queue untouched, which
       is far cheaper than not trying at all. */
    if ((!q.length && !dq.length) || flushing) { paintSync(); return; }
    flushing = true;
    fetch("/api/sets", {
      method:"POST", headers:{"content-type":"application/json"},
      body: JSON.stringify({ sets: q, deletes: dq })
    }).then(function(r){
      if (!r.ok) throw new Error("http "+r.status);
      return r.json();
    }).then(function(){
      // Only clear what we sent — anything logged mid-flight survives.
      var now = outbox();
      var sentIds = {}; q.forEach(function(s){ sentIds[s.id] = 1; });
      write(OUTBOX, now.filter(function(s){ return !sentIds[s.id]; }));
      var sentDel = {}; dq.forEach(function(id){ sentDel[id] = 1; });
      write(DELBOX, delbox().filter(function(id){ return !sentDel[id]; }));
      lastSyncFailed = false;
    }).catch(function(){
      lastSyncFailed = true;
      /* stays queued; retried on the interval, on focus and on reconnect */
    }).then(function(){
      flushing = false; paintSync();
    });
  }
  function paintSync(){
    var el = document.getElementById("sync"), n = outbox().length + delbox().length;
    /* Report the last real OUTCOME, not the browser's guess about connectivity.
       navigator.onLine is kept only as a hint in the wording. */
    if (n && lastSyncFailed){
      el.className = "pill pending";
      el.textContent = n + (navigator.onLine ? " to sync — retrying" : " held · looks offline");
      el.title = "Tap to retry now";
      return;
    }
    if (n){ el.className = "pill pending"; el.textContent = n+" to sync"; return; }
    el.className = "pill ok"; el.textContent = "synced";
  }
  /* A stuck queue should have a way out that is not "wait and hope". */
  (function(){ var el=document.getElementById("sync");
    if(el){ el.style.cursor="pointer"; el.title="Tap to retry now";
            el.addEventListener("click", function(){ lastSyncFailed=false; paintSync(); flush(); }); } })();
  setInterval(flush, 15000);
  addEventListener("online", flush);
  addEventListener("visibilitychange", function(){ if (!document.hidden) flush(); });

  // ---------- clock ----------
  function tick(){
    var now = new Date();
    document.getElementById("clock").textContent =
      now.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
    var st = read(STARTED, null);
    var e = document.getElementById("elapsed");
    if (st && st.date === state.date){
      var mins = Math.floor((Date.now() - st.at)/60000);
      e.textContent = mins + " min in";
      e.style.color = mins > 35 ? "var(--warn)" : "";
    } else { e.textContent = ""; }
  }
  setInterval(tick, 1000);

  // ---------- rest timer ----------
  function startRest(secs, label){
    state.restLeft = secs;
    document.getElementById("restL").textContent = label || "Rest";
    document.getElementById("rest").classList.add("on");
    clearInterval(state.restTimer);
    paintRest();
    state.restTimer = setInterval(function(){
      state.restLeft--;
      paintRest();
      if (state.restLeft <= -30) stopRest();
    }, 1000);
  }
  function paintRest(){
    var t = document.getElementById("restT"), s = state.restLeft;
    var neg = s < 0, a = Math.abs(s);
    t.textContent = (neg?"+":"") + Math.floor(a/60) + ":" + String(a%60).padStart(2,"0");
    t.className = "t" + (s <= 0 ? " zero" : "");
    if (s === 0 && navigator.vibrate) navigator.vibrate([120,60,120]);
  }
  function stopRest(){
    clearInterval(state.restTimer);
    document.getElementById("rest").classList.remove("on");
  }
  document.getElementById("restSkip").onclick = stopRest;
  document.getElementById("restAdd").onclick = function(){ state.restLeft += 30; paintRest(); };

  // ---------- data ----------
  function loadLocal(){
    var l = read(LOCAL, null);
    if (l && l.date === state.date){ state.sets = l.sets || []; }
    else { state.sets = []; }
  }
  function saveLocal(){ write(LOCAL, { date: state.date, sets: state.sets }); }

  function fetchLast(){
    var sess = currentSession();
    var names = (sess && sess.exercises) ? sess.exercises.map(function(e){ return e.name; }) : [];
    if (!names.length) { state.last = {}; return Promise.resolve(); }
    var q = names.map(function(n){ return "ex=" + encodeURIComponent(n); }).join("&") +
            "&date=" + encodeURIComponent(state.date) + "&day=" + encodeURIComponent(logDay());
    return fetch("/api/last?" + q)
      .then(function(r){ return r.ok ? r.json() : {last:{}}; })
      .then(function(j){ state.last = j.last || {}; })
      .catch(function(){ state.last = {}; });
  }

  function fetchWeek(){
    /* Asked on the London clock: the pool's days end, and its week resets, at
       midnight Europe/London whatever timezone the phone is in. */
    return fetch("/api/week-status?date=" + encodeURIComponent(londonToday()))
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){ if (j && j.core && j.rows) { state.week = j; write(WEEK, j); } })
      .catch(function(){ /* the picker degrades to "not known", never to "done" */ });
  }

  // ---------- rendering ----------
  // A SEARCH, not a chosen video. A hardcoded link rots — the channel deletes
  // it, the video goes private — and it rots silently, which at the rack is
  // worse than no link. A search always resolves to current results.
  function formLink(name){
    return "https://www.youtube.com/results?search_query=" +
           encodeURIComponent(name + " proper form");
  }

  // ---------- which session is in view ----------
  /* ⭐ Mon–Fri come from programme.js, always. A locked Planner MORNING slot
     only fills a day the programme leaves empty (Sat/Sun), and a locked
     Planner BONUS slot replaces the bonus menu for its day. Decided 3 Oct 2026,
     so that a slot locked under the old programme cannot silently hide the new
     one. */
  var P = window.PROGRAMME, W = window.IronWeek;

  function lc(s){ return String(s).toLowerCase(); }
  function libEntry(name){
    var n = lc(name);
    for (var i = 0; i < state.lib.length; i++) if (lc(state.lib[i].name) === n) return state.lib[i];
    return null;
  }
  function planSlot(day, slot){
    for (var i = 0; i < state.plan.length; i++){
      var p = state.plan[i];
      if (p.day === day && p.slot === slot) return p;
    }
    return null;
  }
  function cuesFor(name){
    var e = P.exercises[name] || {};
    return (e.cues || []).map(function(c){ return P.cues[c]; }).filter(Boolean).concat(e.note ? [e.note] : []);
  }
  function isWarm(name){
    return P.warmup.choices.some(function(c){ return lc(c.ex) === lc(name); });
  }

  // Programme blocks -> the session the page renders.
  function fromBlocks(label, blocks, extra){
    var s = W.expand(P, blocks);
    var out = { label: label, blocks: s.blocks, exercises: s.exercises };
    for (var k in extra) out[k] = extra[k];
    return out;
  }
  // The optional warm-up sits outside the three-block cap, ahead of block 1.
  function withWarmup(sess){
    var w = W.expand(P, P.warmup.choices.map(function(c){ return [c]; })).exercises;
    w.forEach(function(e){ e.warm = true; });
    sess.warmup = w;
    sess.exercises = w.concat(sess.exercises);
    sess.exercises.forEach(function(e, i){ e.index = i; });
    return sess;
  }
  // Exercises with no blocks of their own (Planner, pool, PT): straight sets.
  function straight(label, exs, extra){
    exs.forEach(function(e, i){ e.block = i; e.index = i; });
    var out = { label: label, exercises: exs,
                blocks: exs.map(function(e){ return { superset: false, exercises: [e] }; }) };
    for (var k in extra) out[k] = extra[k];
    return out;
  }
  function fromLibrary(name, sets, reps, weight){
    var l = libEntry(name) || {}, e = P.exercises[name] || {};
    return { name: name, sets: sets != null ? sets : (l.sets || 3), reps: reps || l.reps || "8-12",
             suggested: weight != null ? weight : (l.weight != null ? l.weight : null), kit: null,
             rest: e.rest != null ? e.rest : (l.rest != null ? l.rest : 75), step: e.step || l.step || null,
             band: !!e.band || l.kind === "banded", side: !!(e.side || l.side), cues: cuesFor(name) };
  }

  function plannedSession(day, slot){
    var p = planSlot(day, slot);
    if (!p || !p.locked || !p.exercises || !p.exercises.length) return null;
    return straight(slot === "morning" ? "Planned session" : "Planned bonus",
      p.exercises.map(function(x){ return fromLibrary(x.name, x.sets, x.reps, x.weight); }),
      { planned: true });
  }
  function coreFor(day){
    var d = P.days[day];
    if (d) return withWarmup(fromBlocks(d.label, d.blocks,
      { core: true, heads: true, minutes: d.minutes, ptAlternative: !!d.ptAlternative }));
    var p = plannedSession(day, "morning");
    if (p) p.core = true;
    return p;
  }
  function planBonusId(){ return "plan-" + state.day; }
  // A planned bonus for today replaces the menu: the point of planning it is
  // that there is one answer, not a choice.
  function bonusChoices(){
    if (plannedSession(state.day, "bonus")) {
      var o = {}; o[planBonusId()] = { label: "Planned bonus" }; return o;
    }
    return P.bonus;
  }

  // ---------- the week: pool and tally ----------
  function londonToday(){ return W.todayIn(P.timezone); }
  function weekKnown(){
    return !!(state.week && state.week.rows && state.week.weekStart === W.weekDates(londonToday()).mon);
  }
  function weekRows(){ return W.mergeRows(weekKnown() ? state.week.rows : [], state.sets, state.date); }
  // null while this week's sets have not loaded: an unknown pool must never
  // read as "empty" (it would unlock bonus work) or as "everything missed".
  function poolNow(){ return weekKnown() ? W.computePool(P, weekRows(), londonToday()) : null; }
  // The pool as it stood before today's pool work, so a pool session keeps its
  // shape — sets already worked off today show as done rather than vanishing.
  function poolAtStart(){
    if (!weekKnown()) return null;
    var rows = weekRows().filter(function(r){ return !(r.day === "pool" && r.date === state.date); });
    return W.computePool(P, rows, londonToday());
  }
  function poolSession(){
    var start = poolAtStart();
    if (!start) return null;
    var exs = start.exercises.map(function(p){
      var e = fromLibrary(p.exercise, p.remaining, p.reps);
      e.kit = p.kit; e.from = p.from;
      return e;
    });
    // Anything worked off today that is no longer in the starting pool (a
    // second device, say) still shows, so its sets can be corrected.
    state.sets.forEach(function(s){
      if (s.day === "pool" && !exs.some(function(e){ return lc(e.name) === lc(s.exercise); }))
        exs.push(fromLibrary(s.exercise, 0));
    });
    return straight("Pool — catch-up", exs, { pool: true });
  }

  var PT = "ironlog.pt.v1";            // today's PT exercise list, this device
  function ptNames(){
    var p = read(PT, null), names = (p && p.date === state.date) ? p.names.slice() : [];
    state.sets.forEach(function(s){ if (s.day === "pt" && names.indexOf(s.exercise) < 0) names.push(s.exercise); });
    return names;
  }
  function ptSession(){
    return straight(P.ptLabel, ptNames().map(function(n){ return fromLibrary(n); }), { pt: true });
  }

  function currentSession(){
    if (state.mode === "pool") return poolSession();
    if (state.mode === "pt") return ptSession();
    if (state.mode === "bonus"){
      if (String(state.bonusId).indexOf("plan-") === 0) return plannedSession(String(state.bonusId).slice(5), "bonus");
      var b = P.bonus[state.bonusId];
      return b ? fromBlocks(b.label, b.blocks, { bonus: true, heads: true }) : null;
    }
    return coreFor(state.day);
  }
  function isBonus(){ return state.mode === "bonus"; }

  // What goes in the `day` column. Bonus, pool and PT sets are kept apart from
  // the planned day's so the pool and the history can tell them apart.
  function logDay(){
    if (state.mode === "bonus") return "bonus:" + state.bonusId;
    if (state.mode === "pool") return "pool";
    if (state.mode === "pt") return "pt";
    return state.day;
  }

  // Any sets logged today for the session in view.
  function setsToday(){
    var d = logDay();
    return state.sets.some(function(s){ return s.day === d; });
  }
  // Today's planned session has working sets logged (a warm-up alone is not it).
  function coreLogged(){
    return weekRows().some(function(r){ return r.day === state.day && r.sets > 0 && !isWarm(r.exercise); });
  }
  function ptLogged(){
    return weekRows().some(function(r){ return r.day === "pt" && r.sets > 0; });
  }

  function setsFor(name){
    // Scoped to the session in view: the same lift can appear in today's
    // session AND in pool work later the same day, and they are different sets.
    var d = logDay();
    return state.sets.filter(function(s){ return s.exercise === name && s.day === d; });
  }

  // In a superset, the lift to do next: the one behind, the first on a tie.
  function nextInBlock(b){
    var best = null, bestN = Infinity;
    b.exercises.forEach(function(e){
      var n = setsFor(e.name).length;
      if (n < e.sets && n < bestN){ best = e; bestN = n; }
    });
    return best;
  }

  var DAY_NAME = { mon:"Mon", tue:"Tue", wed:"Wed", thu:"Thu", fri:"Fri", sat:"Sat", sun:"Sun" };

  function poolCardHTML(){
    var pool = poolNow();
    if (state.mode === "pool"){
      return '<p class="note">Sets missed earlier this week. Log them as normal — each one comes off the pool. ' +
             'The pool clears Sunday 23:59 (London); anything left then drops off.</p>';
    }
    if (!pool || !pool.total) return "";
    var byDay = {};
    pool.items.forEach(function(m){ (byDay[m.day] = byDay[m.day] || []).push(m); });
    return '<div class="card poolcard"><div class="cardhead"><h2>Pool · ' + pool.total + ' set' + (pool.total === 1 ? '' : 's') + '</h2>' +
             '<button class="smallbtn" data-mode="pool">Work the pool</button></div>' +
           '<ul class="plist">' + Object.keys(byDay).map(function(d){
             return '<li><b>' + DAY_NAME[d] + '</b> ' + byDay[d].map(function(m){
               return esc(m.exercise) + ' <span class="pmark">' + m.remaining + '</span>';
             }).join(' · ') + '</li>';
           }).join("") + '</ul>' +
           '<p class="note" style="margin:6px 0 0">Clears Sunday 23:59 (London). Bonus work unlocks once it is empty.</p></div>';
  }

  function fmtSets(n){ return (Math.round(n * 2) / 2).toString().replace(/\.5$/, "½").replace(/^0½$/, "½"); }
  function tallyHTML(){
    if (!weekKnown()) return '<div class="card tally"><div class="cardhead"><h2>This week</h2></div>' +
      '<p class="note" style="margin:0">Volume shows once this week&rsquo;s sets have loaded.</p></div>';
    var t = W.tally(P, weekRows(), state.lib);
    return '<div class="card tally"><div class="cardhead"><h2>This week</h2>' +
             '<span class="note" style="margin:0">sets · direct 1, indirect ½</span></div>' +
      t.map(function(r){
        var target = r.min == null ? "—" : (r.approx ? "~" + r.min : (r.min === r.max ? r.min : r.min + "–" + r.max));
        var top = r.max || r.min || 0;
        var pct = top ? Math.min(100, Math.round(r.sets / top * 100)) : 0;
        return '<div class="trow s-' + r.status + '"><span class="tm">' + esc(r.muscle) + '</span>' +
               '<span class="tbar">' + (top ? '<i style="width:' + pct + '%"></i>' : '') + '</span>' +
               '<span class="tv"><b>' + fmtSets(r.sets) + '</b> / ' + target + '</span></div>';
      }).join("") + '</div>';
  }

  function cardHTML(ex, isNext, i){
    var done = setsFor(ex.name);
    var last = state.last[ex.name];
    var complete = ex.sets > 0 && done.length >= ex.sets;
    var prefill = suggest(ex, last, done);
    return '<div class="card' + (complete ? " done" : "") + (isNext ? " next" : "") + '">' +
      '<div class="exhead">' +
        '<p class="exname">' + esc(ex.name) + (isNext ? ' <span class="nexttag">Next</span>' : '') + '</p>' +
        '<span style="display:flex;gap:6px">' +
          '<button type="button" class="formlink" style="background:none;cursor:pointer" data-rm="' + esc(ex.name) + '">Maxes</button>' +
          '<a class="formlink" href="' + formLink(ex.name) + '" target="_blank" rel="noopener noreferrer">Form &#8599;</a>' +
        '</span>' +
      '</div>' +
      '<div class="target">' + (ex.sets ? ex.sets + ' × ' : '') + esc(ex.reps) + ' reps' + (ex.side ? " per side" : "") + ' · ' + ex.rest + 's rest' +
        (ex.kit ? ' <span class="tag">' + esc(ex.kit) + '</span>' : '') +
        (ex.suggested != null ? ' · suggested <b>' + fmtW(ex.suggested) + (ex.band ? ' (band)' : ' kg') + '</b>' : '') + '</div>' +
      (ex.from ? '<div class="target">From ' + ex.from.map(function(f){ return DAY_NAME[f.day] + ' ' + f.sets; }).join(' · ') + '</div>' : '') +
      (ex.cues && ex.cues.length ? '<ul class="cues">' + ex.cues.map(function(c){ return '<li>' + esc(c) + '</li>'; }).join("") + '</ul>' : '') +
      '<div class="last">' + (last
          ? 'Last time: <b>' + esc(last.summary) + '</b>' + (last.date ? ' · ' + esc(last.date) : '')
          : 'No previous record — this one sets the baseline.') + '</div>' +
      '<div class="chips">' +
        done.map(function(s, idx){
          return '<button type="button" class="chip' + (idx === done.length - 1 ? " fresh" : "") + '" ' +
                 'data-edit="' + esc(s.id) + '" aria-label="Edit set ' + (idx + 1) + '">' +
                 s.reps + ' × ' + fmtW(s.weight) + '</button>';
        }).join("") +
      '</div>' +
      '<div class="steppers">' +
        stepperHTML(i, "reps", "Reps", prefill.reps, 1) +
        stepperHTML(i, "weight", ex.band ? "Band level" : "Weight kg", prefill.weight, ex.step || (ex.band ? 1 : 2.5)) +
      '</div>' +
      '<button class="logbtn" data-log="' + i + '">' +
        (complete || !ex.sets ? "Log an extra set" : "Log set " + (done.length + 1) + " of " + ex.sets) +
      '</button>' +
    '</div>';
  }

  function ptAddHTML(){
    return '<div class="card"><div class="cardhead"><h2>Add an exercise</h2></div>' +
      '<p class="note">Whatever Sophie has you doing. Pick from the library or type a new name.</p>' +
      '<div class="addrow" style="margin-top:0">' +
        '<input id="ptName" list="ptLib" placeholder="Exercise" autocomplete="off" ' +
          'style="flex:1;min-width:0;background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:11px;font-size:16px">' +
        '<datalist id="ptLib">' + state.lib.map(function(l){ return '<option value="' + esc(l.name) + '">'; }).join("") + '</datalist>' +
        '<button id="ptAdd">Add</button>' +
      '</div></div>';
  }
  function wirePt(){
    var b = document.getElementById("ptAdd");
    if (!b) return;
    b.onclick = function(){
      var v = document.getElementById("ptName").value.trim().replace(/\s+/g, " ");
      if (!v) return;
      var l = libEntry(v); if (l) v = l.name;          // keep the library's spelling, so history joins up
      var names = ptNames();
      if (names.some(function(n){ return lc(n) === lc(v); })) return;
      names.push(v);
      write(PT, { date: state.date, names: names });
      render(); fetchLast().then(render);
    };
  }

  function render(){
    var prog = currentSession();
    var app = document.getElementById("app");
    document.getElementById("dayLabel").textContent =
      prog ? (isBonus() ? "Bonus — " + prog.label : prog.label) : "—";

    var html = poolCardHTML();

    if (!prog){
      var weekend = state.day === "sat" || state.day === "sun";
      var pool = poolNow();
      app.innerHTML = html +
        '<div class="card"><div class="rest-day">' +
          '<h2>' + (state.mode === "pool" ? "Pool not loaded yet" : "Nothing planned today") + '</h2>' +
          '<p>' + (state.mode === "pool"
            ? "This week&rsquo;s sets have not loaded, so the pool is not known yet. It appears once the server answers."
            : (weekend ? "No planned work at the weekend — it is for catching up. " : "") +
              (pool && pool.total ? "Work the pool above." : (pool ? "The pool is empty: pick a bonus above if you fancy one." : ""))) + '</p>' +
        '</div></div>' + tallyHTML() + footHTML();
      wireTop(); wireFoot();
      return;
    }

    // Pool work, a bonus or PT adds to the week; it does not stand in for
    // today's planned session (PT stands in for Wednesday only, by design).
    var today = coreFor(state.day);
    if (state.mode !== "core" && today && !coreLogged() && !(state.mode === "pt" && today.ptAlternative)){
      html += '<div class="card outstanding"><b>Today&rsquo;s session is still outstanding.</b> ' +
              'This adds to the week; it does not stand in for it.</div>';
    }

    if (prog.core && prog.minutes){
      html += '<p class="note">Up to ' + prog.minutes + ' min. ' + esc(P.effort) + ' ' + esc(P.progression) + '</p>';
    }
    if (prog.pool && !prog.exercises.length){
      html += '<div class="card"><div class="rest-day"><h2>Pool is empty</h2><p>Nothing missed this week.</p></div></div>';
    }
    if (prog.pt && !prog.exercises.length){
      html += '<p class="note">Log the PT session here instead of the solo leg day. Once a set is logged, the squats and deadlifts stay out of the pool.</p>';
    }

    if (prog.warmup){
      var warmDone = prog.warmup.some(function(e){ return setsFor(e.name).length; });
      html += '<details class="warm"' + (warmDone ? ' open' : '') + '><summary>' + esc(P.warmup.label) +
              ' — pick one, 2 light sets</summary>' +
              prog.warmup.map(function(e){ return cardHTML(e, false, e.index); }).join("") + '</details>';
    }

    prog.blocks.forEach(function(b, bi){
      var nxt = b.superset ? nextInBlock(b) : null;
      html += '<div class="blk' + (b.superset ? ' ss' : '') + '">' +
        (prog.heads ? '<div class="blockhead">B' + (bi + 1) + ' · ' + (b.superset ? 'Superset — alternate set by set' : 'Straight sets') + '</div>' : '') +
        b.exercises.map(function(e){ return cardHTML(e, nxt === e, e.index); }).join("") +
      '</div>';
    });

    if (prog.pt) html += ptAddHTML();

    app.innerHTML = html + tallyHTML() + footHTML();
    wireCards();
    wireTop();
    wirePt();
    wireFoot();
  }

  // Buttons in the page body that switch session ("Work the pool").
  function wireTop(){
    document.querySelectorAll("#app [data-mode]").forEach(function(b){
      b.onclick = function(){ choose(b.dataset.mode, null); };
    });
  }

  function suggest(ex, last, done){
    if (done.length) return { reps: done[done.length-1].reps, weight: done[done.length-1].weight };
    /* Last time beats the suggestion: the suggestion is where the lift starts,
       the log is where it has got to. It still shows on the card either way. */
    if (last && last.topReps != null) return { reps: last.topReps, weight: last.topWeight };
    var lo = parseInt(String(ex.reps).split("-")[0], 10) || 10;
    return { reps: lo, weight: ex.suggested != null ? ex.suggested : 0 };
  }

  function stepperHTML(i, field, label, val, step){
    return '<div class="stepper">' +
      '<div class="lab">'+label+'</div>' +
      '<div class="srow">' +
        '<button class="sbtn" data-step="'+i+'|'+field+'|-'+step+'">−</button>' +
        '<input class="sval" inputmode="decimal" data-f="'+i+'|'+field+'" value="'+val+'">' +
        '<button class="sbtn" data-step="'+i+'|'+field+'|'+step+'">+</button>' +
      '</div></div>';
  }

  function footHTML(){
    return '<div class="foot">' +
      '<button id="btnHist">History</button>' +
      '<button id="btnEnd" class="primary">End session</button>' +
    '</div>';
  }

  function wireCards(){
    document.querySelectorAll("[data-step]").forEach(function(b){
      b.onclick = function(){
        var p = b.dataset.step.split("|");
        var inp = document.querySelector('[data-f="'+p[0]+"|"+p[1]+'"]');
        var v = (parseFloat(inp.value)||0) + parseFloat(p[2]);
        if (v < 0) v = 0;
        inp.value = fmtW(v);
      };
    });
    document.querySelectorAll("[data-log]").forEach(function(b){
      b.onclick = function(){ logSet(parseInt(b.dataset.log,10)); };
    });
    document.querySelectorAll("[data-edit]").forEach(function(b){
      b.onclick = function(){ openEdit(b.dataset.edit); };
    });
    document.querySelectorAll("#app [data-rm]").forEach(function(b){
      b.onclick = function(){ window.IronPlanner.showMaxes(b.dataset.rm); };
    });
  }

  function wireFoot(){
    var h = document.getElementById("btnHist"), e = document.getElementById("btnEnd");
    if (h) h.onclick = showHistory;
    if (e) e.onclick = function(){ document.getElementById("endDlg").showModal(); };
  }

  function logSet(i){
    var sess = currentSession(), ex = sess.exercises[i];
    var reps   = parseFloat(document.querySelector('[data-f="'+i+'|reps"]').value) || 0;
    var weight = parseFloat(document.querySelector('[data-f="'+i+'|weight"]').value) || 0;
    if (reps <= 0) return;

    if (!read(STARTED, null) || read(STARTED,{}).date !== state.date){
      write(STARTED, { date: state.date, at: Date.now() });
    }

    var rec = {
      id: uid(), date: state.date, day: logDay(), exercise: ex.name,
      set_index: setsFor(ex.name).length + 1,
      reps: reps, weight: weight, ts: new Date().toISOString()
    };
    state.sets.push(rec);
    saveLocal();
    queue(rec);
    /* A superset alternates set by set: a short rest and the other lift next.
       Once the other lift is finished (4 sets against 3), the rest is the
       lift's own straight-set rest. */
    var rest = ex.rest, label = "Rest — " + ex.name;
    var blk = !ex.warm && sess.blocks[ex.block];
    if (blk && blk.superset){
      var other = blk.exercises.filter(function(e){ return e !== ex; })[0];
      if (other && setsFor(other.name).length < other.sets) label = "Next: " + other.name;
      else rest = (P.exercises[ex.name] || {}).rest || ex.rest;
    }
    buildPicker();
    render();
    startRest(rest, label);
  }

  // ---------- editing a logged set ----------
  /* Corrections happen mid-session: the wrong number gets tapped, or a set is
     logged twice while the phone is on the floor. state.sets is today only, so
     this fixes today's session — the case that actually comes up between sets.
     Editing an earlier day would mean fetching it back from D1 first. */
  var editingId = null;

  function findSet(id){
    for (var i = 0; i < state.sets.length; i++) if (state.sets[i].id === id) return state.sets[i];
    return null;
  }

  /* Deleting set 2 of 3 would otherwise leave sets numbered 1 and 3, and the
     next set logged would take index 3 as well — setsFor().length + 1. Renumber
     in performed order and hand back only the rows that actually moved, so the
     outbox carries corrections rather than the whole exercise every time. */
  function renumber(exercise, day){
    var group = state.sets.filter(function(x){ return x.exercise === exercise && x.day === day; });
    group.sort(function(a, b){ return String(a.ts).localeCompare(String(b.ts)); });
    var now = new Date().toISOString(), moved = [];
    group.forEach(function(x, i){
      if (x.set_index !== i + 1){ x.set_index = i + 1; x.edited_at = now; moved.push(x); }
    });
    return moved;
  }

  function openEdit(id){
    var st = findSet(id); if (!st) return;
    editingId = id;
    var prog = currentSession();
    var ex = prog && prog.exercises ? prog.exercises.filter(function(e){ return e.name === st.exercise; })[0] : null;
    var step = ex ? (ex.step || (ex.band ? 1 : 2.5)) : 1;
    document.getElementById("edWhat").textContent =
      st.exercise + " · set " + st.set_index + (ex && ex.side ? " · per side" : "");
    document.getElementById("edWLab").textContent = ex && ex.band ? "Band level" : "Weight kg";
    var r = document.getElementById("edReps"), w = document.getElementById("edWeight");
    r.value = st.reps; w.value = fmtW(st.weight);
    w.dataset.step = step; w.step = step;
    document.getElementById("editDlg").showModal();
  }

  document.querySelectorAll("[data-ed]").forEach(function(b){
    b.onclick = function(){
      var p = b.dataset.ed.split("|");
      var isReps = p[0] === "reps";
      var inp = document.getElementById(isReps ? "edReps" : "edWeight");
      var stepv = isReps ? 1 : (parseFloat(inp.dataset.step) || 1);
      var v = (parseFloat(inp.value) || 0) + parseFloat(p[1]) * stepv;
      if (v < 0) v = 0;
      inp.value = isReps ? String(Math.round(v)) : fmtW(v);
    };
  });

  document.getElementById("edCancel").onclick = function(){
    editingId = null; document.getElementById("editDlg").close();
  };

  document.getElementById("edSave").onclick = function(){
    var st = findSet(editingId); if (!st){ document.getElementById("editDlg").close(); return; }
    var reps = parseInt(document.getElementById("edReps").value, 10) || 0;
    var weight = parseFloat(document.getElementById("edWeight").value) || 0;
    /* Zero reps is a deletion wearing a disguise, and a set row that says it
       happened zero times would quietly corrupt the volume maths. */
    if (reps <= 0){ alert("A set needs at least one rep. Use Delete to remove it."); return; }
    if (reps !== st.reps || weight !== st.weight){
      st.reps = reps; st.weight = weight;
      st.edited_at = new Date().toISOString();
      saveLocal(); queue(st);
    }
    editingId = null;
    document.getElementById("editDlg").close();
    render();
  };

  document.getElementById("edDelete").onclick = function(){
    var st = findSet(editingId); if (!st){ document.getElementById("editDlg").close(); return; }
    if (!confirm("Delete this set — " + st.reps + " × " + fmtW(st.weight) + "?")) return;
    var ex = st.exercise, day = st.day, id = st.id;
    state.sets = state.sets.filter(function(x){ return x.id !== id; });
    queueDelete(id);
    renumber(ex, day).forEach(queue);
    saveLocal();
    editingId = null;
    document.getElementById("editDlg").close();
    buildPicker();
    render();
  };

  // ---------- end session ----------
  document.getElementById("endCancel").onclick = function(){ document.getElementById("endDlg").close(); };
  document.getElementById("endGo").onclick = function(){
    var body = {
      date: state.date, day: logDay(),
      bodyweight: parseFloat(document.getElementById("bw").value) || null,
      felt: document.getElementById("felt").value,
      notes: document.getElementById("notes").value || "",
      started_at: (read(STARTED,{}) || {}).at || null,
      sets: state.sets
    };
    var wasBonus = isBonus();
    var btn = this; btn.disabled = true; btn.textContent = "Syncing…";
    flush();
    fetch("/api/session/end", {
      method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify(body)
    }).then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
      .then(function(res){
        btn.disabled = false; btn.textContent = "Finish & sync";
        document.getElementById("endDlg").close();
        if (res.ok && res.j.ok) {
          var j = res.j;
          var msg = "Session saved — " + j.sets + " sets across " + j.exercises + " exercises"
                + (j.minutes != null ? ", " + j.minutes + " min" : "") + ".";
          // The fuelling rule fires at the moment it applies, so nothing has to
          // be remembered later. Bonus sessions only.
          if (wasBonus && window.BONUS_TOPUP) {
            msg += "\n\n🍫 " + window.BONUS_TOPUP.prompt + "\n" + window.BONUS_TOPUP.detail;
          }
          alert(msg);
        } else {
          alert("Saved locally, but the server did not confirm. It will retry.\n\n" + (res.j.error || ""));
        }
        localStorage.removeItem(STARTED);
        stopRest();
        fetchWeek().then(function(){ buildPicker(); render(); });
      })
      .catch(function(){
        btn.disabled = false; btn.textContent = "Finish & sync";
        alert("The server did not respond. Your session is saved on this device and will keep retrying — nothing is lost. Tap the sync pill to try again now.");
      });
  };

  // ---------- history ----------
  function showHistory(){
    var dlg = document.getElementById("histDlg"), body = document.getElementById("histBody");
    body.innerHTML = '<div class="empty">Loading…</div>';
    dlg.showModal();
    fetch("/api/history?limit=15").then(function(r){ return r.json(); }).then(function(j){
      if (!j.sessions || !j.sessions.length){ body.innerHTML = '<div class="empty">Nothing logged yet.</div>'; return; }
      body.innerHTML = j.sessions.map(function(s){
        return '<div class="h"><div class="hd">'+esc(s.date)+' · '+esc(s.day)+'</div>' +
               '<div class="hl">'+esc(s.summary)+'</div></div>';
      }).join("");
    }).catch(function(){
      body.innerHTML = '<div class="empty">Offline — history lives on the server.</div>';
    });
  }
  document.getElementById("histClose").onclick = function(){ document.getElementById("histDlg").close(); };
  document.getElementById("histExport").onclick = function(){
    fetch("/api/history?limit=1000&raw=1").then(function(r){ return r.json(); }).then(function(j){
      var blob = new Blob([JSON.stringify(j, null, 2)], {type:"application/json"});
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "ironlog-" + state.date + ".json";
      a.click();
    });
  };

  // ---------- misc ----------
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function fmtW(w){ var n = Math.round(parseFloat(w)*100)/100; return String(n); }

  // Today's session (and PT on Wednesday), the pool, and — only once the pool
  // is empty — bonus work.
  function choose(mode, bonusId){
    state.mode = mode; state.bonusId = bonusId || null; state.chosen = true;
    buildPicker();
    render();
    fetchLast().then(render);
  }

  function buildPicker(){
    var p = document.getElementById("picker");
    var core = coreFor(state.day);
    var h = "";

    if (core){
      var mark = coreLogged() ? " · done" : (weekKnown() ? " · not yet" : "");
      h += '<div class="prow">' +
             '<button class="' + (core.ptAlternative ? '' : 'wide') + (state.mode === "core" ? ' sel' : '') + '" data-mode="core">' +
               esc(core.label) + '<span class="pmark">' + mark + '</span></button>' +
             (core.ptAlternative
               ? '<button class="' + (state.mode === "pt" ? 'sel' : '') + '" data-mode="pt">' + esc(P.ptLabel) +
                 (ptLogged() ? ' <span class="pmark">✓</span>' : '') + '</button>'
               : '') +
           '</div>';
    }

    var pool = poolNow();
    if (pool && (pool.total || state.mode === "pool")){
      h += '<div class="prow"><span class="plabel">Pool</span>' +
           '<button class="' + (state.mode === "pool" ? 'sel' : '') + '" data-mode="pool">' +
             (pool.total ? pool.total + ' set' + (pool.total === 1 ? '' : 's') + ' to catch up' : 'Empty ✓') + '</button></div>';
    }

    if (pool && !pool.total){
      var choices = bonusChoices();
      h += '<div class="prow bonusrow"><span class="plabel">Bonus</span>' +
           Object.keys(choices).map(function(id){
             var did = (state.week && state.week.bonus || []).some(function(x){ return x.id === id; });
             return '<button data-b="' + id + '"' + (isBonus() && state.bonusId === id ? ' class="sel"' : '') + '>' +
                    esc(choices[id].label) + (did ? ' <span class="pmark">✓</span>' : '') + '</button>';
           }).join("") + '</div>';
    } else {
      h += '<div class="prow"><span class="plabel">Bonus</span><span class="pmark" style="font-size:13px">' +
           (pool ? 'unlocks once the pool is empty' : 'waiting for this week&rsquo;s sets to load') + '</span>' +
           // A bonus already under way stays reachable, so its sets can be corrected.
           (isBonus() ? '<button class="sel" data-b="' + esc(state.bonusId) + '">In progress</button>' : '') +
           '</div>';
    }

    p.innerHTML = h;
    p.querySelectorAll("button").forEach(function(b){
      b.onclick = function(){
        if (b.dataset.b) choose("bonus", b.dataset.b);
        else choose(b.dataset.mode, null);
      };
    });
  }

  // Where the page opens when nothing has been chosen yet: today's session if
  // there is one, otherwise the pool if it has anything in it.
  function defaultMode(){
    if (state.chosen) return;
    if (coreFor(state.day)) { state.mode = "core"; return; }
    var pool = poolNow();
    state.mode = pool && pool.total ? "pool" : "core";
  }

  // ---------- boot ----------
  state.day = window.DAY_KEYS[new Date().getDay()];
  loadLocal();
  (function(){
    var w = read(WEEK, null);
    if (w && w.rows) state.week = w;
  })();

  // Follow whatever session is already in progress today, so a reload
  // mid-session lands back where you were rather than on the default.
  var lastSet = state.sets[state.sets.length - 1];
  if (lastSet && lastSet.day) {
    var ld = String(lastSet.day);
    if (ld.indexOf("bonus:") === 0) { state.mode = "bonus"; state.bonusId = ld.slice(6); state.chosen = true; }
    else if (ld === "pool" || ld === "pt") { state.mode = ld; state.chosen = true; }
  }
  defaultMode();

  buildPicker();
  tick();
  paintSync();
  render();
  flush();

  // The week's sets decide the pool, the tally and whether today's session
  // shows as done, so the picker is rebuilt once they land.
  fetchWeek().then(function(){
    defaultMode();
    buildPicker();
    render();
    return fetchLast();
  }).then(render);

  // The plan is cached so the gym works offline; refresh it quietly and
  // re-render only if something actually changed.
  function refreshPlan(){
    return Promise.all([
      fetch("/api/plan").then(function(r){ return r.ok ? r.json() : null; }),
      fetch("/api/exercises").then(function(r){ return r.ok ? r.json() : null; })
    ]).then(function(res){
      var before = JSON.stringify([state.plan, state.lib]);
      if (res[0] && res[0].slots) { state.plan = res[0].slots; write(PLAN, state.plan); }
      if (res[1] && res[1].exercises) { state.lib = res[1].exercises; write(LIB, state.lib); }
      if (res[1] && res[1].muscles) state.vocab = { muscles: res[1].muscles, equipment: res[1].equipment };
      if (JSON.stringify([state.plan, state.lib]) !== before) {
        buildPicker(); render(); fetchLast().then(render);
      }
      return res;
    }).catch(function(){ return null; });
  }
  refreshPlan();

  window.IronLog = {
    state: state, refreshPlan: refreshPlan, esc: esc, fmtW: fmtW,
    setPlan: function(slots){ state.plan = slots; write(PLAN, slots); buildPicker(); render(); },
    setLib: function(lib){ state.lib = lib; write(LIB, lib); render(); }
  };
})();
</script>
<script src="planner.js"></script>
</body>
</html>
